<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Event Feedback Sentiment Analysis (phi3:mini)</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }

        #chart {
            width: 90%;
            max-width: 1000px;
            height: 550px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            padding: 10px;
        }

        #progress {
            text-align: center;
            font-size: 15px;
            color: #666;
        }
    </style>
</head>

<body>
    <h2>AI Feedback Analysis — phi3:mini</h2>
    <p id="progress">Loading feedback data...</p>
    <div id="chart"></div>

    <script>
        // ===== Load CSV with feedback data =====
        async function loadCSV(url) {
            const txt = await (await fetch(url)).text();
            const [headerLine, ...lines] = txt.trim().split(/\r?\n/);
            const headers = headerLine.split(",");
            return lines.map(line => {
                const parts = line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/);
                const obj = {};
                headers.forEach((h, i) => obj[h.trim()] = parts[i]?.replace(/^"|"$/g, "").trim());
                return obj;
            });
        }

        // ===== Call Ollama for sentiment =====
        async function analyzeSentiment(text) {
            const prompt = `
You are a strict sentiment classifier.
Classify the following feedback as one of these three exact words:
"positive", "negative", or "neutral".

Respond with ONLY one of those words — no punctuation, explanation, or extra text.

Feedback: "${text}"
`;

            try {
                const response = await fetch("http://localhost:11434/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "qwen2.5:1.5b",
                        prompt: prompt
                    })
                });

                const raw = await response.text();
                const cleaned = raw.toLowerCase().replace(/[^a-z]/g, " ").trim();

                let sentiment = "neutral";
                if (cleaned.includes("positive")) sentiment = "positive";
                else if (cleaned.includes("negative")) sentiment = "negative";
                else if (cleaned.includes("neutral")) sentiment = "neutral";

                console.log("Model output:", raw, "→ Parsed:", sentiment);
                return sentiment;

            } catch (err) {
                console.error("Ollama error:", err);
                return "neutral";
            }
        }

        // ===== Analyze and plot results =====
        async function analyzeAndVisualize() {
            const feedbackData = await loadCSV("feedback.csv");
            const scores = {};

            console.log(feedbackData);

            document.getElementById("progress").textContent = "Analyzing feedback with phi3:mini...";

            // Gather all event IDs (1–5) so even missing ones appear
            const allEventIDs = [...new Set(feedbackData.map(d => String(d.eventid).trim()))];

            for (let i = 0; i < feedbackData.length; i++) {
                const { eventid, feedback } = feedbackData[i];
                const id = String(eventid).trim();

                const sentiment = await analyzeSentiment(feedback);
                const score = sentiment === "positive" ? 1 : sentiment === "negative" ? -1 : 0;

                if (!scores[id]) scores[id] = [];
                scores[id].push(score);

                document.getElementById("progress").textContent =
                    `Analyzed ${i + 1}/${feedbackData.length} feedbacks... (${id}: ${sentiment})`;
            }

            // Compute average for all event IDs, fill 0 for missing
            const eventIDs = allEventIDs;
            const avgScores = eventIDs.map(id =>
                scores[id] ? (scores[id].reduce((a, b) => a + b, 0) / scores[id].length) : 0
            );

            console.log("Event IDs:", eventIDs);
            console.log("Average Scores:", avgScores);

            document.getElementById("progress").textContent = "Plotting results...";

            const colors = avgScores.map(s =>
                s > 0 ? "rgba(75,192,192,0.8)" :
                    s < 0 ? "rgba(255,99,132,0.8)" :
                        "rgba(160,160,160,0.6)"
            );

            const trace = {
                x: eventIDs,
                y: avgScores,
                type: "bar",
                text: avgScores.map(s => s.toFixed(2)),
                textposition: "auto",
                marker: { color: colors }
            };

            const layout = {
                title: "Average Feedback Sentiment per Event",
                xaxis: { title: "Event ID" },
                yaxis: { title: "Sentiment Score (-1 = Negative, +1 = Positive)", range: [-1, 1] },
                paper_bgcolor: "#fdfdfd",
                plot_bgcolor: "#fdfdfd"
            };

            Plotly.newPlot("chart", [trace], layout);
            document.getElementById("progress").textContent = "✅ Analysis Complete!";
        }

        analyzeAndVisualize();
    </script>

</body>

</html>
