<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Financial Dashboard | IT Club</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 30px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }
    p {
      text-align: center;
      color: #666;
      font-size: 15px;
      margin-bottom: 40px;
    }
    #chart {
      width: 90%;
      max-width: 1000px;
      height: 550px;
      margin: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      padding: 10px;
    }
  </style>
</head>
<body>
  <h2>Event Cost, Revenue & Profit Analysis</h2>
  <p>Interactive visualization of financial performance for each club event</p>
  <div id="chart"></div>

  <script>
    // Utility: load CSV with support for quoted fields
    async function loadCSV(url) {
      const response = await fetch(url);
      const data = await response.text();
      const lines = data.trim().split("\n");
      const headers = lines[0].split(",");
      const rows = lines.slice(1).map(line => {
        const fields = [];
        let insideQuotes = false, field = "";
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"' && line[i + 1] === '"') { field += '"'; i++; continue; }
          if (c === '"') { insideQuotes = !insideQuotes; continue; }
          if (c === ',' && !insideQuotes) { fields.push(field.trim()); field = ""; }
          else { field += c; }
        }
        fields.push(field.trim());
        return fields;
      });
      return { headers, rows };
    }

    async function plotFinancialData() {
      const csv = await loadCSV("events.csv");

      // Extract indices
      const idxName = csv.headers.indexOf("event_name");
      const idxCost = csv.headers.indexOf("cost");
      const idxRevenue = csv.headers.indexOf("revenue");

      if (idxName === -1 || idxCost === -1 || idxRevenue === -1) {
        alert("events.csv missing cost/revenue columns!");
        return;
      }

      const eventNames = [];
      const costs = [];
      const revenues = [];
      const profits = [];

      csv.rows.forEach(row => {
        const name = row[idxName].replace(/^"|"$/g, "");
        const cost = parseFloat(row[idxCost]) || 0;
        const revenue = parseFloat(row[idxRevenue]) || 0;
        const profit = revenue - cost;
        eventNames.push(name);
        costs.push(cost);
        revenues.push(revenue);
        profits.push(profit);
      });

      // Plotly traces
      const traceCost = {
        x: eventNames,
        y: costs,
        name: "Cost",
        type: "bar",
        marker: { color: "rgba(255,99,132,0.7)" },
        hovertemplate: "<b>%{x}</b><br>Cost: ₹%{y:.2f}<extra></extra>"
      };

      const traceRevenue = {
        x: eventNames,
        y: revenues,
        name: "Revenue",
        type: "bar",
        marker: { color: "rgba(75,192,192,0.7)" },
        hovertemplate: "<b>%{x}</b><br>Revenue: ₹%{y:.2f}<extra></extra>"
      };

      const traceProfit = {
        x: eventNames,
        y: profits,
        name: "Profit/Loss",
        type: "bar",
        marker: {
          color: profits.map(p => p >= 0 ? "rgba(54,162,235,0.7)" : "rgba(255,159,64,0.7)")
        },
        hovertemplate: "<b>%{x}</b><br>Profit/Loss: ₹%{y:.2f}<extra></extra>"
      };

      const layout = {
        barmode: "group",
        title: { text: "Event Financial Performance", font: { size: 22 } },
        xaxis: { title: "Event Name", tickangle: -30 },
        yaxis: { title: "Amount (₹)", zeroline: true },
        legend: { orientation: "h", y: -0.2 },
        margin: { t: 80, b: 100 },
        paper_bgcolor: "#fdfdfd",
        plot_bgcolor: "#fdfdfd"
      };

      Plotly.newPlot("chart", [traceCost, traceRevenue, traceProfit], layout);
    }

    plotFinancialData();
  </script>
</body>
</html>
